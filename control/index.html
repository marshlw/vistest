<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisTest · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EEE8;--card:#FBFAF8;--ink:#17181B;--muted:#55575E;--muted2:#8A8C93;
 --line:#DEDBD3;--line2:#E7E4DD;--pass:#1E7A4D;--pass-bg:#E9F3EE;--fail:#C8341F;--fail-bg:#FBEAE6;
 --warn:#B8760B;--warn-bg:#FBF0DC;--accent:#3A34C4;--accent-bg:#EAE8F8;
 --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Instrument Sans',-apple-system,Segoe UI,Roboto,sans-serif;
 --shadow:0 1px 2px rgba(23,24,27,.05);--shadow-lg:0 8px 30px rgba(23,24,27,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:940px;margin:0 auto;padding:34px 26px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.mark span{width:14px;height:14px;border-radius:4px;background:#fff}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--muted2);font-size:11px;letter-spacing:1.4px;font-weight:600;text-transform:uppercase}
.lead{color:var(--muted);margin:2px 0 24px;font-size:14px}
h2{font-size:17px;margin:28px 0 12px}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);color:var(--ink);
 border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.btn:hover{border-color:#C8C4BA}
.btn.dark{background:#17181B;border-color:#17181B;color:#fff}.btn.dark:hover{background:#000}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{border-color:#EBB9AE;color:var(--fail)}.btn.danger:hover{background:var(--fail-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;background:var(--bg);outline:none;color:var(--ink)}
.inp:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto auto auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line3,#EDEAE3)}
.row:last-child{border:0}
.tname{font-weight:700;font-family:var(--mono);font-size:13.5px}
.tmeta{font-size:12px;color:var(--muted2);margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.dot.ok{background:#3FB768}.dot.bad{background:#D0553F}.dot.idle{background:#C7C2B7}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.full{background:var(--accent-bg);color:var(--accent)}
.tag.lite{background:var(--line3,#EDEAE3);color:var(--muted)}
.field{margin-bottom:12px}
.field label{font-size:10.5px;letter-spacing:.6px;color:var(--muted2);font-weight:600;text-transform:uppercase;display:block;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--muted2)}.mono{font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--muted2)}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* overlay + modal */
#login{position:fixed;inset:0;background:rgba(240,238,232,.9);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}
#login .box{width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-lg)}
.modal-bg{position:fixed;inset:0;background:rgba(23,24,27,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:56px 24px;z-index:60}
.modal{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-lg);width:640px;max-width:100%;padding:20px 22px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mclose{border:0;background:none;font-size:22px;color:var(--muted2);cursor:pointer}
.log{background:#101012;color:#d8dbe2;font-family:var(--mono);font-size:12px;border-radius:10px;padding:12px 14px;max-height:360px;overflow:auto;white-space:pre-wrap;margin-top:12px;line-height:1.5}
.bar{display:flex;align-items:center;gap:9px;margin-top:6px;color:var(--muted);font-size:13px}
.msg{color:var(--fail);font-size:13px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div class="top">
    <div class="mark"><span></span></div>
    <div><h1>VisTest · Control</h1><div class="sub">Изолированные инстансы команд</div></div>
    <button class="btn sm" style="margin-left:auto" id="logout">Выйти</button>
  </div>
  <div class="lead">Панель оператора: команды, здоровье, создание, обновление и снятие изолированных инстансов. Управление людьми внутри команды — в самом VisTest.</div>

  <div style="display:flex;align-items:center;justify-content:space-between">
    <h2 style="margin:0">Команды</h2>
    <div style="display:flex;gap:9px"><button class="btn sm" id="refresh">Обновить</button><button class="btn sm" id="proxyBtn">Пересобрать прокси</button></div>
  </div>
  <div class="card" id="teams"><div class="empty"><span class="spin"></span></div></div>

  <h2>Создать команду</h2>
  <div class="card">
    <div class="grid">
      <div class="field"><label>Имя команды</label><input class="inp" id="cTeam" placeholder="alpha"></div>
      <div class="field"><label>Логин администратора</label><input class="inp" id="cAdmin" placeholder="anna"></div>
    </div>
    <div class="grid">
      <div class="field"><label>Базовый домен (необязательно)</label><input class="inp" id="cDomain" placeholder="vistest.example.com"></div>
      <div class="field" style="display:flex;align-items:end"><label class="chk"><input type="checkbox" id="cFull"> толстый образ (запись и тесты в инстансе)</label></div>
    </div>
    <button class="btn dark" id="createBtn">Создать инстанс</button>
    <div class="msg" id="cMsg"></div>
  </div>
</div>

<div id="login">
  <div class="box">
    <div class="top" style="margin-bottom:12px"><div class="mark"><span></span></div><div><h1 style="font-size:18px">VisTest · Control</h1><div class="sub">операторский доступ</div></div></div>
    <form id="loginForm">
      <div class="field"><label>Операторский токен</label><input class="inp" id="opToken" type="password" placeholder="VISTEST_OP_TOKEN" autocomplete="off"></div>
      <div class="msg" id="lgMsg"></div>
      <button class="btn dark" type="submit" style="width:100%;justify-content:center">Войти</button>
    </form>
    <div class="faint" style="font-size:12px;margin-top:12px" id="notConfigured"></div>
  </div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
function el(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(p,opts){
  const r=await fetch(p,opts);
  if(!r.ok){let d='';try{d=(await r.clone().json()).detail;}catch{d=await r.text();}throw new Error(typeof d==='string'?d:JSON.stringify(d));}
  return r.status===204?null:r.json();
}
/* ---- auth ---- */
async function boot(){
  let me;try{me=await api('/api/control/me');}catch{me={authed:false,configured:false};}
  if(!me.configured)$('#notConfigured').textContent='На сервере не задан VISTEST_OP_TOKEN — панель не примет вход. Задайте переменную и перезапустите control-plane.';
  if(me.authed){showApp();}else{$('#login').style.display='flex';$('#opToken').focus();}
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#lgMsg').textContent='';
  try{await api('/api/control/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('#opToken').value})});location.reload();}
  catch(err){$('#lgMsg').textContent=String(err.message||err);}
};
$('#logout').onclick=async()=>{try{await api('/api/control/logout',{method:'POST'});}catch{}location.reload();};
function showApp(){$('#login').style.display='none';$('#app').style.display='block';loadTeams();}
/* ---- teams ---- */
async function loadTeams(){
  const box=$('#teams');
  let data;try{data=await api('/api/control/teams');}catch(e){box.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>';return;}
  const t=data.teams||[];
  if(!t.length){box.innerHTML='<div class="empty">Команд ещё нет. Создайте первую ниже.</div>';return;}
  box.innerHTML='';
  t.forEach(x=>{
    const dot=x.healthy?'ok':(x.status==='running'?'bad':'idle');
    const addr=x.domain?`https://${x.team}.${x.domain}/ui/`:`http://127.0.0.1:${x.port}/ui/`;
    const row=el('div','row');
    row.innerHTML=`<div><div class="tname"><span class="dot ${dot}"></span>${esc(x.team)}</div>
      <div class="tmeta">${esc(x.status)} · <a href="${esc(addr)}" target="_blank" class="mono">${esc(addr)}</a></div></div>
      <span class="tag ${x.full?'full':'lite'}">${x.full?'толстый':'ревью'}</span>
      <span class="mono faint">:${esc(x.port)}</span>`;
    const up=el('button','btn sm','Обновить');up.onclick=()=>job(api('/api/control/teams/'+encodeURIComponent(x.team)+'/upgrade',{method:'POST'}),'Обновление '+x.team);
    const rm=el('button','btn sm danger','Снять');rm.onclick=()=>removeTeam(x.team);
    row.append(up,rm);box.append(row);
  });
}
$('#refresh').onclick=loadTeams;
$('#createBtn').onclick=()=>{
  const team=$('#cTeam').value.trim();$('#cMsg').textContent='';
  if(!team){$('#cMsg').textContent='Укажите имя команды';return;}
  job(api('/api/control/teams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    team,admin:$('#cAdmin').value.trim()||undefined,domain:$('#cDomain').value.trim()||undefined,full:$('#cFull').checked})}),
    'Создание команды '+team,()=>{$('#cTeam').value='';loadTeams();});
};
$('#proxyBtn').onclick=()=>{
  const domain=prompt('Базовый домен для прокси (например vistest.example.com):');if(domain===null)return;
  job(api('/api/control/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:domain.trim()||undefined})}),'Пересборка прокси');
};
function removeTeam(team){
  const purge=confirm('Снять инстанс «'+team+'».\n\nOK — удалить и данные (том). Отмена — оставить том.');
  // confirm gives OK(true)=purge, Cancel(false)=keep. Ask second confirm to proceed at all:
  if(!confirm('Точно снять «'+team+'»'+(purge?' вместе с данными?':' (данные сохранить)?')))return;
  job(api('/api/control/teams/'+encodeURIComponent(team)+'?purge='+(purge?'true':'false'),{method:'DELETE'}),'Снятие '+team,loadTeams);
}
/* ---- job log modal ---- */
async function job(starter,title,then){
  const wrap=el('div');
  wrap.innerHTML=`<div class="mhead"><b style="font-size:16px">${esc(title)}</b><button class="mclose">×</button></div>`;
  const bar=el('div','bar');bar.innerHTML='<span class="spin"></span> запуск…';
  const log=el('div','log');wrap.append(bar,log);
  const bg=el('div','modal-bg');const m=el('div','modal');m.append(wrap);bg.append(m);document.body.append(bg);
  const close=()=>bg.remove();$('.mclose',wrap).onclick=close;bg.onclick=e=>{if(e.target===bg)close();};
  let r;try{r=await starter;}catch(e){bar.innerHTML='';log.append(line('l-err',String(e.message||e)));return;}
  const jid=r&&r.job_id;if(!jid){bar.textContent='готово';if(then)then();return;}
  let off=0;
  while(true){
    await new Promise(x=>setTimeout(x,800));
    let j;try{j=await api('/api/control/jobs/'+jid+'?since='+off);}catch(e){bar.innerHTML='связь потеряна';break;}
    (j.log||[]).forEach(t=>log.append(line('',t)));log.scrollTop=log.scrollHeight;off=j.log_offset;
    if(j.status!=='running'){bar.innerHTML=j.status==='done'?'<span style="color:#3FB768">готово</span>':'<span style="color:#D0553F">ошибка</span>';if(then&&j.status==='done')then();break;}
  }
}
function line(c,t){const d=el('div');d.textContent=t;if(c==='l-err')d.style.color='#ff8a7a';return d;}
boot();
</script>
</body>
</html>
