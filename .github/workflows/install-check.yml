# Install check: does the package install and work on a clean machine?
#
# Run by hand only: Actions → Install check → Run workflow. Both jobs run the
# same script, scripts/check_install.py, from the checked-out branch.
#
#  - job `wheel`    — builds the wheel in this run and installs it without an
#                     index: checks a branch BEFORE anything is uploaded;
#  - job `testpypi` — installs vistest==<version> from TestPyPI (dependencies
#                     from the real PyPI) and runs the script.
#
# Matrix: ubuntu / windows / macos × Python 3.10–3.13 = 12 runs per job.

name: Install check

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version on TestPyPI (for the testpypi job), e.g. 0.2.0.dev2"
        required: false
        default: "0.2.0.dev2"
      what:
        description: "What to run: wheel (built from the branch), testpypi or both"
        required: true
        default: "wheel"
        type: choice
        options: [wheel, testpypi, both]

permissions:
  contents: read

jobs:
  # ---- 1. A wheel built right here: the branch is checked before any upload -- #
  build:
    if: ${{ inputs.what == 'wheel' || inputs.what == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build, twine check, audit of the archives
        run: |
          python -m pip install build twine "readme_renderer[md]"
          python -m build --outdir dist
          twine check --strict dist/*
          python scripts/audit_dist.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5          # scripts/ and examples/: the wheel does not carry them
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Install from the wheel and check
        shell: bash
        run: |
          python scripts/check_install.py \
            --wheel "$(ls dist/*.whl)" \
            ${{ runner.os == 'Linux' && '--with-deps' || '' }}

  # ---- 2. What is on TestPyPI ------------------------------------------------ #
  testpypi:
    if: ${{ inputs.what == 'testpypi' || inputs.what == 'both' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5          # only for scripts/ and examples/
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install vistest==${{ inputs.version }} from TestPyPI and check
        shell: bash
        run: |
          python scripts/check_install.py \
            --version "${{ inputs.version }}" \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            ${{ runner.os == 'Linux' && '--with-deps' || '' }}
