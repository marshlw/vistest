# CI of the public repository: the library only (o1d).
#
# The server lives in its own, private repository (vistest-server) with its
# own CI: its tests, the database migrations, the interface in jsdom and in
# Chromium, the image. Nothing here installs it or needs it.
#
#  - windows     the core and the library on Windows, Python 3.11 and 3.13;
#  - latest-deps the newest release of each base dependency, ceilings ignored;
#  - library     lint and the whole tests/ on Linux, 3.11 and 3.12;
#  - audit       known vulnerabilities in what `vistest` pulls in;
#  - i18n        no new Russian text.
#
# The wheel on a clean machine (Linux, Windows, macOS × 3.11–3.14) is the
# Install check workflow, run by hand.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # The library mode runs on the users' machines, and a good share of those
  # are Windows: paths with backslashes and drive letters, CRLF checkouts, a
  # different temp directory, no fork. Everything else in this workflow runs
  # on Linux and would not notice. The list is the core, the library,
  # snapshot naming, the warp and the frozen corpus.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        # Git Bash, so the globs below expand the same way they do on Linux.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Core and library on Windows
        run: >
          pytest -q
          tests/test_core_*.py
          tests/test_library_*.py
          tests/test_console_review_c.py
          tests/test_naming.py
          tests/test_warp.py
          tests/test_corpus_frozen.py

  # The job the comment above `dependencies` in pyproject.toml describes.
  # The base dependencies carry upper bounds by major version; this job
  # installs the newest release of each IGNORING those bounds, so the next
  # numpy or OpenCV major breaks a build we own before it breaks a user's run.
  # Red here means "look before raising a ceiling", not "the code is broken":
  # keep it out of the required checks in branch protection.
  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install, then the newest of each base dependency
        run: |
          pip install -e ".[dev]"
          # No version specifiers on purpose: pip warns that vistest's
          # ceilings are violated and installs the newest anyway.
          pip install --upgrade numpy opencv-python-headless pillow pyyaml
          pip list | grep -Ei "numpy|opencv|pillow|pyyaml"

      - name: Core and library on the newest dependencies
        run: >
          pytest -q
          tests/test_core_*.py
          tests/test_library_*.py
          tests/test_console_review_c.py
          tests/test_naming.py
          tests/test_warp.py
          tests/test_corpus_frozen.py

  # The library, the way it is installed from the index: `vistest` with its
  # extras and nothing of the server.
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound of requires-python (>= 3.11) and the current.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # Without the [browser] extra: with Playwright installed and no
        # browser downloaded, two tests whose "no Chromium here" check
        # predates the library's install hint fail instead of skipping
        # (report o1c). The library with its browser is what the Install
        # check workflow checks (scripts/check_install.py).
        run: pip install -e ".[report,dev]"

      - name: The server is not here
        run: |
          python -c "import vistest_server" 2>/dev/null && exit 1
          python -c "import fastapi" 2>/dev/null && exit 1
          echo "no vistest_server, no fastapi"

      - name: Lint
        run: ruff check vistest/ tests/ examples/ scripts/

      - name: Tests
        # tests/test_benchmark.py measures speed and is not a merge check.
        run: >
          pytest tests/ -q
          --ignore=tests/test_benchmark.py

  # Known vulnerabilities in the dependencies of the library. A job of its
  # own, not a step: a red `pip-audit` means "there is a CVE", not "the code
  # is broken", and one status for both is how you stop reading either.
  # Audited in an environment of its own, so the list is what `vistest`
  # pulls in, not a job's test tools.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Known vulnerabilities in the dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/pip" install ".[browser,report]"
          # The project itself is not looked up (--strict fails on anything
          # it cannot find on the index): audit what it pulls in.
          "$RUNNER_TEMP/audit-env/bin/pip" freeze --exclude vistest \
            > "$RUNNER_TEMP/audit-reqs.txt"
          pip install pip-audit
          pip-audit --strict --desc --no-deps --disable-pip -r "$RUNNER_TEMP/audit-reqs.txt"

  # The English-only ratchet. A separate job, and for the same reason as the
  # audit: a red ratchet means somebody wrote a Russian comment, not that
  # the code is broken.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check_i18n.py reads the tracked file list from git.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: No new Russian text
        run: python scripts/check_i18n.py
