# Проверки самого VisTest — линтер, тесты, запуск интерфейса.
#
# `visual.yml` рядом гоняет визуальные проверки продукта на самом себе, и это
# другой вопрос. Здесь — то, без чего нельзя мержить: сходится ли код, проходят
# ли тесты и поднимается ли интерфейс.
#
# Запуск интерфейса стоит отдельным шагом не для симметрии. Его поломки не
# ловятся чтением файлов: страница загружается, навигация рисуется, а первого
# экрана нет — и выглядит это как повисший сервис. Пятнадцать секунд в jsdom
# закрывают этот класс целиком.
#
# Там же гоняются клиенты для чужих наборов (npm-пакет и файл для JVM): в
# питоновской работе нет ни node, ни java, и их проверки там пропускались бы —
# то есть были бы зелёными, ничего не проверив.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # The library mode runs on the users' machines, and a good share of those
  # are Windows: paths with backslashes and drive letters, CRLF checkouts, a
  # different temp directory, no fork. Everything else in this workflow runs
  # on Linux and would not notice. The list is the part of the suite that
  # does not need the server: the core, the library, snapshot naming, the
  # warp and the frozen corpus.
  #
  # Plus test_wheel_ui.py, which needs no [server] here: it builds the wheel
  # from a copy of the sources and installs it with its `server` extra into a
  # venv of its own, then starts `vistest serve` from an empty directory and
  # asks for /ui/. That is the install a Windows user does, and the one place
  # the wheel's Scripts\vistest.exe and its copy of the UI are exercised.
  # It downloads the server's dependencies: about a minute.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        # Git Bash, so the globs below expand the same way they do on Linux.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Core and library on Windows
        run: >
          pytest -q
          tests/test_core_*.py
          tests/test_library_*.py
          tests/test_console_review_c.py
          tests/test_naming.py
          tests/test_warp.py
          tests/test_corpus_frozen.py
          tests/test_wheel_ui.py

  # The job the comment above `dependencies` in pyproject.toml describes.
  # The base dependencies carry upper bounds by major version; this job
  # installs the newest release of each IGNORING those bounds, so the next
  # numpy or OpenCV major breaks a build we own before it breaks a user's run.
  # Red here means "look before raising a ceiling", not "the code is broken":
  # keep it out of the required checks in branch protection.
  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install, then the newest of each base dependency
        run: |
          pip install -e ".[dev]"
          # No version specifiers on purpose: pip warns that vistest's
          # ceilings are violated and installs the newest anyway.
          pip install --upgrade numpy opencv-python-headless pillow pyyaml
          pip list | grep -Ei "numpy|opencv|pillow|pyyaml"

      - name: Core and library on the newest dependencies
        run: >
          pytest -q
          tests/test_core_*.py
          tests/test_library_*.py
          tests/test_console_review_c.py
          tests/test_naming.py
          tests/test_warp.py
          tests/test_corpus_frozen.py
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница из pyproject (requires-python >= 3.10) и текущая.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # Без браузерных зависимостей: e2e исключены ниже, а всё остальное
        # обходится ядром и сервисом.
        run: pip install -e ".[server,dev]" numpy opencv-python-headless pillow

      - name: Lint
        run: ruff check vistest/ tests/

      - name: Tests
        # e2e поднимают настоящий браузер и живут в отдельной работе ниже;
        # benchmark меряет скорость и в проверке мержа не участвует.
        run: >
          pytest tests/ -q
          --ignore=tests/e2e
          --ignore=tests/test_benchmark.py

  # The English-only ratchet. A separate job, and for the same reason as the
  # audit below: a red ratchet means somebody wrote a Russian comment, not that
  # the code is broken, and one status for both is how you stop reading either.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check_i18n.py reads the tracked file list from git.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: No new Russian text
        run: python scripts/check_i18n.py

  # Уязвимости в зависимостях. Отдельной работой, а не шагом в основной:
  # красный `pip-audit` — это «есть CVE», а не «код сломан», и смешивать эти
  # два сигнала в одном статусе значит однажды перестать смотреть на оба.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -c constraints-service.txt ".[server]"
          # vistest itself is not on PyPI, and --strict fails on anything it
          # cannot look up. Audit what the server pulls in, not the project.
          pip freeze --exclude vistest > "$RUNNER_TEMP/audit-reqs.txt"
          pip install pip-audit
      - name: Известные уязвимости в зависимостях
        run: pip-audit --strict --desc --no-deps --disable-pip -r "$RUNNER_TEMP/audit-reqs.txt"

  # Миграции на базе ПРОШЛОЙ версии.
  #
  # Схема догоняется списком `MIGRATIONS`, и до появления `PRAGMA user_version`
  # проверить это было нечем: тесты всегда создают базу с нуля, то есть путь
  # обновления не проходил вообще никогда. А ломается именно он — на
  # инсталляции, которая работает полгода.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[server,dev]" numpy opencv-python-headless pillow

      - name: База прошлого релиза открывается этим кодом
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD~1)
          echo "Предыдущая версия: $PREV"
          git worktree add /tmp/prev "$PREV"
          # Базу создаёт СТАРЫЙ код — иначе мы бы снова проверяли создание с нуля.
          PYTHONPATH=/tmp/prev python -c "
          from vistest.api.db import Database
          db = Database('/tmp/old.db')
          db.execute(\"INSERT INTO project(name) VALUES('shop')\")
          print('старая база создана')
          "
          # А открывает — новый, вместе с миграциями.
          python -c "
          from vistest.api.db import Database, SCHEMA_VERSION
          db = Database('/tmp/old.db')
          assert db.schema_version() == SCHEMA_VERSION, db.schema_version()
          assert db.one(\"SELECT name FROM project WHERE name='shop'\")
          print('миграции применились, данные на месте')
          "

  # Интерфейс в настоящем браузере. Тяжелее остального, поэтому отдельно и
  # только на pull request'ах: смысл этих тестов — поймать экран, который
  # перестал рисоваться, а такое приезжает именно с правками интерфейса.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[full,dev]"
          python -m playwright install --with-deps chromium
      - name: Интерфейс в Chromium
        run: pytest tests/e2e -q

  # Образ должен собираться и подниматься. Проверка дешёвая, а ловит целый
  # класс поломок, которых не видно из исходников: не поехал файл в COPY,
  # разошлись версии, сервис не стартует под непривилегированным пользователем.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Сборка
        run: docker build -f docker/Dockerfile.api -t vistest-api:ci .
      - name: Сервис отвечает
        run: |
          set -e
          docker run -d --name vistest-ci -p 8420:8420 vistest-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8420/api/health >/dev/null; then
              echo "поднялся за ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "не ответил за 30 секунд"; docker logs vistest-ci; exit 1
      - name: Логи
        if: always()
        run: docker logs vistest-ci || true

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install -e ".[dev]"
          npm install --no-save jsdom

      - name: Файлы интерфейса сходятся
        run: pytest tests/test_frontend_modules.py tests/test_frontend_defaults.py -q

      # Циклом, а не строкой на файл. Список по одному рос и отставал:
      # экран добавляли, строку в CI забывали — и проверка, написанная ради
      # него же, молча не гонялась. Каталог не забывает.
      - name: Экраны интерфейса в jsdom
        run: |
          set -e
          for f in tests/ui/*.mjs; do
            echo "── $f"
            node "$f" frontend
          done

      # Клиенты для чужих наборов проверяются здесь, а не в питоновской
      # работе: там нет ни node, ни jsdom, и обе проверки просто пропускались
      # бы — то есть выглядели бы зелёными, ничего не проверив.
      - name: Клиенты для чужих наборов
        run: pytest tests/test_clients_js.py tests/test_clients_java.py -q
