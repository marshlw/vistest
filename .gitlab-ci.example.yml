# Visual checks with the VisTest library, in GitLab CI.
#
# An example: copy the jobs you need into your own .gitlab-ci.yml. It assumes a
# project whose tests call expect_screenshot and keep their baselines in
# tests/__vistest__/.
#
# The one rule: baselines and checks are taken in the same image. Text is
# drawn differently on Windows, macOS and Linux, so a baseline taken on a
# developer's machine never matches one taken in a container. The baselines
# live in one directory per platform (linux-chromium-1x-1440x900/...), and the
# set CI compares against is the one taken in this image.

variables:
  # The image and the Playwright pin are one pair: the image carries the
  # browser of exactly this Playwright, and a newer Playwright installed into
  # it looks for a browser the image does not have. Change both together.
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright/python:v1.56.0-noble"
  PLAYWRIGHT_VERSION: "1.56.0"
  # The image's Python may be marked as managed by the system (PEP 668), and
  # then pip refuses to install into it. A CI job's container is thrown away
  # after the job, so installing there is what is wanted; a pip too old to know
  # the variable ignores it.
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  GIT_DEPTH: "0"

.visual:
  image: $PLAYWRIGHT_IMAGE
  before_script:
    # Baselines are usually in git LFS: PNGs grow a repository quickly.
    - git lfs install --skip-repo && git lfs pull || true
    - pip install --no-cache-dir "vistest[browser]" "playwright==$PLAYWRIGHT_VERSION"


# --------------------------------------------------------------------------- #
#  The checks
# --------------------------------------------------------------------------- #
visual:test:
  extends: .visual
  stage: test
  script:
    - pytest tests/ --junitxml=junit-visual.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      # The pictures of the run, the diffs and the report: one HTML file,
      # pictures inside, opens with no network.
      - .vistest/
    reports:
      junit: junit-visual.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# --------------------------------------------------------------------------- #
#  New baselines — by hand, for a person to look at
# --------------------------------------------------------------------------- #
#
# Updating baselines inside a regular pipeline means the checks no longer check
# anything: every break quietly becomes the new normal. So this job is manual,
# and it does not commit: it takes the pictures in the image CI runs in and
# leaves them as an artifact. Download it, look at the pictures, and commit
# tests/__vistest__/ like any other change, through review.
visual:baselines:
  extends: .visual
  stage: test
  script:
    - pytest tests/ --vistest-update || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/__vistest__/
      - .vistest/report/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true


# --------------------------------------------------------------------------- #
#  The noise of the stand — on a schedule
# --------------------------------------------------------------------------- #
#
# Can a red check be believed? The page is loaded several times with nothing
# changing in between, so any difference is false by construction. When the
# number goes up, the stand became unstable, and that is what to fix.
visual:doctor:
  extends: .visual
  stage: test
  script:
    - vistest doctor "$VISTEST_DOCTOR_URL" --runs 5 --out .vistest/doctor
  variables:
    VISTEST_DOCTOR_URL: "https://staging.example.com/"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - .vistest/doctor/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
