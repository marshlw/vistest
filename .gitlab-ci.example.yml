# Визуальные тесты в GitLab CI.
#
# Файл-пример: скопируйте нужные job'ы в свой `.gitlab-ci.yml`. Отдельным
# файлом, а не готовым `.gitlab-ci.yml`, потому что у проекта почти наверняка
# уже есть свой пайплайн, и подменять его целиком неправильно.
#
# Главное правило визуальных тестов в CI: **эталоны и прогон должны рождаться
# в одном и том же образе.** Рендер текста в Windows, macOS и Linux физически
# разный, поэтому эталон, снятый на машине разработчика, в контейнере не
# совпадёт никогда. Поэтому образ здесь тот же, что в `docker/Dockerfile.runner`,
# и он же используется при локальном снятии эталонов через `run.py docker`.

variables:
  # Тег обязан совпадать с версией playwright в зависимостях, иначе браузер и
  # клиент разъедутся. Для полной воспроизводимости пиньте по digest:
  #   mcr.microsoft.com/playwright/python@sha256:<digest>
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright/python:v1.47.0-jammy"
  # Ключ платформы эталонов. Совпадает с тем, что даёт `run.py docker`.
  VISTEST_IN_DOCKER: "1"
  # Артефакты и история — внутри рабочего каталога, чтобы GitLab их забрал.
  VISTEST_ROOT: "$CI_PROJECT_DIR/.vistest"
  GIT_DEPTH: "0"

# Эталоны обычно лежат в git-lfs: PNG в обычном git пухнут быстро.
.lfs: &lfs
  - git lfs install --skip-repo || true
  - git lfs pull || true


# --------------------------------------------------------------------------- #
#  Основной job: прогон визуальных тестов
# --------------------------------------------------------------------------- #
visual:test:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  # Chromium в контейнере падает на маленьком /dev/shm. Для shared runner'ов
  # без прав на docker-опции помогает флаг --disable-dev-shm-usage, но чище
  # выделить память.
  variables:
    FF_USE_FASTZIP: "true"
  before_script:
    - *lfs
    - pip install --no-cache-dir -e ".[full]"
    # Шрифты — второй по частоте источник расхождений с эталоном после
    # версии браузера. Набор должен быть тем же, что в Dockerfile.runner.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        fonts-liberation2 fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji
    - fc-cache -f
  script:
    # Визуальные тесты гоняются последовательно: параллельный запуск даёт
    # конкуренцию за CPU, отчего анимации и таймауты ведут себя иначе, и
    # снимки начинают дрожать. Экономия времени того не стоит.
    - >
      pytest tests/ -v
      --vistest-preset balanced
      -p no:randomly
  variables:
    VISTEST_PROJECT: "$CI_PROJECT_PATH"
    VISTEST_RUN_ID: "$CI_PIPELINE_ID-$CI_JOB_ID"
    # Адрес, под которым сервис видно снаружи. Без него в комментарии не будет
    # ссылок вовсе — и это правильнее, чем ссылка на `localhost`, не работающая
    # ни у одного читателя merge request.
    VISTEST_PUBLIC_URL: ""
  after_script:
    # Отчёт, который можно скачать из GitLab и приложить к тикету: один файл,
    # картинки внутри, открывается без сети.
    - python -m vistest.cli report --out "$CI_PROJECT_DIR/visual-report.html" || true
    # JUnit для вкладки «Tests» в merge request. Ниже в artifacts:reports он
    # объявлен — а раньше файл никто не создавал, и GitLab каждый раз показывал
    # пустой отчёт вместо списка снимков.
    - >
      python -m vistest.cli gate
      --junit "$CI_PROJECT_DIR/junit-visual.xml" || true
    # Сводка для комментария в merge request. Рендерит её VisTest, публикует
    # GitLab — и это разделение намеренное: научить сервис ходить в GitLab
    # самому значило бы просить токен с правом писать в чужие репозитории и
    # хранить его у себя, взамен ничего, чего не делает строчка ниже.
    #
    # Раньше на этом месте (в примере для GitHub) стояли двадцать строк
    # JavaScript, разбиравших `run.json` руками: логика отображения жила в
    # YAML, ничем не проверялась и тихо ломалась при любом переименовании поля.
    - >
      python -m vistest.cli comment
      --out "$CI_PROJECT_DIR/visual-comment.md" || true
    # Публикация — по желанию. Без токена шаг просто не сработает, а файл
    # останется в артефактах, и это уже полезно.
    - >
      test -n "$GITLAB_TOKEN" &&
      glab mr note "$CI_MERGE_REQUEST_IID" -m "$(cat "$CI_PROJECT_DIR/visual-comment.md")"
      || true
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - .vistest/runs/
      - visual-report.html
      - visual-comment.md
    reports:
      junit: junit-visual.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# --------------------------------------------------------------------------- #
#  Подключённый набор тестов (если визуальные тесты живут в другом репозитории
#  или написаны своим способом)
# --------------------------------------------------------------------------- #
visual:project:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  before_script:
    - *lfs
    - pip install --no-cache-dir -e ".[full]"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        fonts-liberation2 fonts-dejavu-core fonts-noto-core
    - fc-cache -f
  script:
    # Подключение описывается один раз и коммитится в .vistest/projects.yaml.
    # Если его нет — автоопределение предложит описание прямо здесь.
    - test -f .vistest/projects.yaml || python -m vistest.cli project add "$CI_PROJECT_DIR"
    - python -m vistest.cli project check "$VISTEST_PROJECT_KEY"
    - python -m vistest.cli project run "$VISTEST_PROJECT_KEY"
  variables:
    VISTEST_PROJECT_KEY: "my-tests"   # ключ из .vistest/projects.yaml
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - .vistest/runs/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true


# --------------------------------------------------------------------------- #
#  Обновление эталонов — только руками и только по кнопке
# --------------------------------------------------------------------------- #
#
# Автоматическое обновление эталонов — самая частая ошибка при внедрении.
# `--update-snapshots` в регулярном пайплайне означает, что тесты больше ничего
# не проверяют: любая поломка молча становится новой нормой.
#
# Поэтому job ручной, требует подтверждения и коммитит результат в ветку, где
# его увидят на ревью — как и любое другое изменение.
visual:update-baselines:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  before_script:
    - *lfs
    - pip install --no-cache-dir -e ".[full]"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        fonts-liberation2 fonts-dejavu-core fonts-noto-core
    - fc-cache -f
  script:
    - pytest tests/ --vistest-update
    - git config user.email "ci@example.com"
    - git config user.name "VisTest CI"
    - git add .vistest/baselines
    - git commit -m "chore(visual): обновление эталонов [$CI_PIPELINE_ID]" || exit 0
    - git push "https://oauth2:$CI_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" HEAD:$CI_COMMIT_REF_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true


# --------------------------------------------------------------------------- #
#  Диагностика шума стенда — по расписанию
# --------------------------------------------------------------------------- #
#
# Отвечает на вопрос «можно ли верить красному тесту». Страница грузится
# несколько раз подряд; поскольку между загрузками ничего не менялось, любое
# расхождение ложное по построению. Если цифра поползла вверх — стенд стал
# нестабильным, и разбирать надо его, а не тесты.
visual:doctor:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  before_script:
    - pip install --no-cache-dir -e ".[full]"
  script:
    - python -m vistest.cli doctor "$VISTEST_DOCTOR_URL" --runs 5 --json
  variables:
    VISTEST_DOCTOR_URL: "https://staging.example.com/"
  artifacts:
    when: always
    paths:
      - .vistest/doctor/
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
