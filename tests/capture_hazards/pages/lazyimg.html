<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>lazy images</title>
<link rel="stylesheet" href="/static/base.css"><script src="/static/common.js"></script>
<style>
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid img { width: 100%; height: auto; aspect-ratio: 160 / 100; border-radius: 8px;
            background: #e5e7eb; display: block; }
.spacer { height: 900px; }
</style></head>
<body>
<header>Gallery</header>
<main>
  <div class="card"><h2>In view</h2><div class="grid" id="top"></div></div>
  <div class="spacer"></div>
  <div class="card"><h2>Below the fold</h2><div class="grid" id="below"></div></div>
</main>
<script>
const img = (i) => `<img loading="lazy" width="160" height="100" alt="" src="${api('/img', { i })}">`;
document.getElementById('top').innerHTML = [0, 1, 2, 3].map(img).join('');
document.getElementById('below').innerHTML = [4, 5, 6, 7].map(img).join('');
/* Ready when the four in view have loaded and been decoded; the four below
   the fold never load until scrolled to, and a wait for every image of the
   page would hang on them. */
const inView = Array.from(document.querySelectorAll('#top img'));
Promise.all(inView.map((im) => (im.complete && im.naturalWidth
  ? im.decode() : new Promise((res) => { im.onload = () => im.decode().then(res, res); }))))
  .then(done);
</script>
</body></html>
