<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>spinner</title>
<link rel="stylesheet" href="/static/base.css"><script src="/static/common.js"></script>
<style>
.spinner { width: 40px; height: 40px; margin: 36px auto 10px; border: 4px solid #dbe3ef;
           border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { text-align: center; }
</style></head>
<body>
<header>Orders</header>
<main>
  <div class="card"><h2>Last week</h2>
    <div id="slot" class="loading"><div class="spinner"></div><p class="muted">Loading…</p></div>
  </div>
</main>
<script>
fetchJSON('/api/data', { h: 'spinner' }).then((d) => {
  const slot = document.getElementById('slot');
  slot.className = '';
  slot.innerHTML = table(d.rows);
  done();
});
</script>
</body></html>
