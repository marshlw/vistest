<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>skeleton</title>
<link rel="stylesheet" href="/static/base.css"><script src="/static/common.js"></script>
<style>
.sk { height: 14px; margin: 12px 0; border-radius: 6px;
      background: linear-gradient(90deg, #e5e9ef 25%, #f3f5f8 37%, #e5e9ef 63%);
      background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
.sk.w60 { width: 60%; } .sk.w40 { width: 40%; } .sk.big { height: 28px; width: 30%; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.stat { font-size: 28px; font-weight: 700; }
</style></head>
<body>
<header>Revenue</header>
<main>
  <div class="card" id="summary">
    <div class="sk big"></div><div class="sk"></div><div class="sk w60"></div>
  </div>
  <div class="card" id="detail">
    <div class="sk"></div><div class="sk w40"></div><div class="sk"></div><div class="sk w60"></div>
  </div>
</main>
<script>
fetchJSON('/api/data', { h: 'skeleton' }).then((d) => {
  document.getElementById('summary').innerHTML =
    `<h2>This month</h2><div class="stat">$${d.total}</div>`
    + `<p class="muted">Status <span class="badge" style="background:${d.accent}">on track</span></p>`;
  document.getElementById('detail').innerHTML = table(d.rows.slice(0, 4));
  done();
});
</script>
</body></html>
