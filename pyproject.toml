[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vistest"
version = "0.1.0"
description = "Precise visual regression testing: ΔE00 + SSIM + alignment + automatic noise suppression"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kirill Kulagin" }]
keywords = ["visual-regression", "screenshot-testing", "playwright", "pytest", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

# What `pip install vistest` brings: the comparison engine, and the parser for
# its config file. In the library mode this package goes into somebody else's
# test environment, next to their own pins, and every name here is one they
# have to resolve against — so the list is short on purpose.
#
# Short, not empty. PyYAML is here because the alternative was worse: install
# the package, write a `vistest.yaml`, and be told to install something else.
# That is the first five minutes of using this tool, spent on a 700 KB pure
# Python wheel. What the base install is meant to keep out is a web server —
# fastapi, uvicorn, starlette — not a config parser.
#
# `tests/test_library_install.py` fails if this list grows, and separately if
# any module reachable from `import vistest` starts pulling something outside
# it. The second check is the one that matters: a dependency list cannot notice
# an import.
#  Upper bounds by major version, and they are not superstition. OpenCV 5.0
#  and numpy 2.x reached a user's machine before they reached this repository:
#  the cascade survived, but finding that out from somebody else's red run is
#  the wrong order. An unbounded requirement means the next major release of
#  any of these ships straight into every project that installs vistest, on the
#  day it is published.
#
#  The ceilings are raised deliberately, after the `latest-deps` job in CI has
#  gone red and somebody has looked at why. That job installs the newest
#  resolvable version of each of these on purpose, so a new major breaks a
#  build we own rather than a run we do not.
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<6",
    "pillow>=10.0,<13",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# A range, not a pin. This extra goes into other people's environments, next
# to a Playwright they may already have, and an exact pin would refuse every
# version but ours. The pin that matters for reproducible pictures — the
# browser build, the fonts, the image — lives with the image: the Dockerfiles
# (docker/Dockerfile.full, docker/Dockerfile.runner) take PLAYWRIGHT_VERSION
# once and use it for both the base image tag and the pip package, so the two
# cannot drift apart.
browser = ["playwright>=1.47,<2", "pytest>=7.4"]
# The server: the review interface, the API, the database. Renamed from
# `service` in 0.2 — one word for one thing, and the library mode made the
# distinction worth being exact about. `pip install "vistest[service]"` no
# longer resolves; the new spelling is `vistest[server]`.
server  = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
           "requests>=2.31"]
ai      = ["onnxruntime>=1.17"]
# ldap3 — чистый Python: ни компилятора, ни системных библиотек, ставится
# внутри закрытого контура. Без него вход через каталог просто выключен.
ldap    = ["ldap3>=2.9"]
report  = ["allure-pytest>=2.13"]
dev     = ["pytest>=7.4", "pytest-cov", "pytest-xdist>=3.5", "ruff",
           "httpx>=0.27", "tomli>=2.0; python_version<'3.11'"]
full    = [
    "playwright>=1.47,<2", "pytest>=7.4",   # a range: see `browser` above
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
    "requests>=2.31", "pyyaml>=6.0",
    "onnxruntime>=1.17", "allure-pytest>=2.13",
]

[project.urls]
Homepage = "https://github.com/marshlw/visual-testing"
Source = "https://github.com/marshlw/visual-testing"
Issues = "https://github.com/marshlw/visual-testing/issues"

[project.scripts]
vistest = "vistest.cli:main"

[project.entry-points.pytest11]
vistest = "vistest.pytest_plugin"

# Temporary. The extension modules still in this repository, registered through
# the same door any installed plugin uses — see vistest/_extensions. Leaves with
# them when the repositories are split. After changing this table, reinstall
# (`pip install -e .`): entry points are read from the installed metadata.
[project.entry-points."vistest.plugins"]
bundled-extensions = "vistest._extensions"

[tool.setuptools.packages.find]
include = ["vistest*"]

# Модель гейта регионов уезжает вместе с пакетом: полтора килобайта
# коэффициентов, читаемых глазами. Без неё гейт молча выключается, и `pip
# install vistest` дал бы движок слабее, чем из исходников.
[tool.setuptools.package-data]
vistest = ["ai/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["visual: visual checks",
           "e2e: run of our own interface in a browser",
           "packaging: builds the wheel and installs it into a fresh environment",
           # Registered here so the mark is known even without pytest-xdist
           # installed. It groups the jsdom screen checks onto one worker
           # under `--dist loadgroup`: they contend for the disk, not the CPU.
           "xdist_group: run these together on one xdist worker"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
